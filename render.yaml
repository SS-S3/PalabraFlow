services:
  # Full-stack Python service (Flask + EasyNMT)
  - type: web
    name: palabraflow
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r server/requirements.txt"
    startCommand: "cd server && python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 10000
